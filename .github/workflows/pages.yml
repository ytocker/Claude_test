name: Deploy v3 (root) + v4 (/v4/) + v5_powerups (/v5_powerups/) to GitHub Pages

# One Pages site per repo means a single artifact replaces the whole
# deploy each time. To keep v3 (active players, root URL), v4 (preview,
# /v4/ sub-path), and the v5_powerups test deploy (/v5_powerups/
# sub-path) reachable, every triggered run rebuilds ALL three branches
# and ships them as one combined artifact.

on:
  push:
    branches: [v3_skybit, v4_skybit, v5_powerups]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v3
        uses: actions/checkout@v4
        with:
          ref: v3_skybit
          path: v3_src

      - name: Checkout v4
        uses: actions/checkout@v4
        with:
          ref: v4_skybit
          path: v4_src

      - name: Checkout v5_powerups
        uses: actions/checkout@v4
        with:
          ref: v5_powerups
          path: v5_src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pygbag
        run: pip install pygame 'pygbag==0.9.2'

      - name: Build v3 WASM bundle
        working-directory: v3_src
        run: python -m pygbag --build main.py

      - name: Inject theme + Supabase into v3
        working-directory: v3_src
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python inject_theme.py

      - name: Build v4 WASM bundle
        working-directory: v4_src
        run: python -m pygbag --build main.py

      - name: Inject theme + Supabase into v4
        working-directory: v4_src
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python inject_theme.py

      - name: Build v5_powerups WASM bundle
        working-directory: v5_src
        run: python -m pygbag --build main.py

      - name: Inject theme + Supabase into v5_powerups
        working-directory: v5_src
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python inject_theme.py

      - name: Combine v3 (root) + v4 (/v4/) + v5_powerups (/v5_powerups/)
        run: |
          mkdir -p combined
          cp -r v3_src/build/web/. combined/
          mkdir -p combined/v4
          cp -r v4_src/build/web/. combined/v4/
          mkdir -p combined/v5_powerups
          cp -r v5_src/build/web/. combined/v5_powerups/
          # GitHub Pages routes through Jekyll by default, which skips
          # paths beginning with `_`. Pygbag emits `_pythons.js`,
          # `_packages/`, etc. — the marker disables Jekyll for the
          # whole site (one at root is enough).
          touch combined/.nojekyll

      - name: List combined build artifacts
        run: |
          echo "root:";        ls -la combined
          echo "v4:";          ls -la combined/v4
          echo "v5_powerups:"; ls -la combined/v5_powerups

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
