name: Deploy main (/) + v4 (/v4/) + v4_powerups (/v4_powerups/) + v5_powerups (/v5_powerups/) to GitHub Pages

# One Pages site per repo means a single artifact replaces the whole
# deploy each time. To keep main (root URL), v4 (/v4/),
# v4_skybit_powerups (/v4_powerups/) and v5_powerups (/v5_powerups/)
# all reachable, every triggered run rebuilds ALL FOUR branches and
# ships them as one combined artifact. This file is intentionally
# identical on main, v4_skybit, v4_skybit_powerups, and v5_powerups
# so a push to any branch produces the same deploy.

on:
  push:
    branches: [main, v4_skybit, v4_skybit_powerups, v5_powerups]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main_src

      - name: Checkout v4_skybit
        uses: actions/checkout@v4
        with:
          ref: v4_skybit
          path: v4_src

      - name: Checkout v4_skybit_powerups
        uses: actions/checkout@v4
        with:
          ref: v4_skybit_powerups
          path: pup_src

      - name: Checkout v5_powerups
        uses: actions/checkout@v4
        with:
          ref: v5_powerups
          path: v5p_src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pygbag
        run: pip install pygame 'pygbag==0.9.2'

      - name: Build main WASM bundle
        working-directory: main_src
        run: python -m pygbag --build main.py

      - name: Inject theme + Supabase into main
        working-directory: main_src
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python inject_theme.py

      - name: Build v4_skybit WASM bundle
        working-directory: v4_src
        run: python -m pygbag --build main.py

      - name: Inject theme + Supabase into v4_skybit
        working-directory: v4_src
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python inject_theme.py

      - name: Build v4_skybit_powerups WASM bundle
        working-directory: pup_src
        run: python -m pygbag --build main.py

      - name: Inject theme + Supabase into v4_skybit_powerups
        working-directory: pup_src
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python inject_theme.py

      - name: Build v5_powerups WASM bundle
        working-directory: v5p_src
        run: python -m pygbag --build main.py

      - name: Inject theme + Supabase into v5_powerups
        working-directory: v5p_src
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python inject_theme.py

      - name: Combine main (root) + v4 (/v4/) + v4_skybit_powerups (/v4_powerups/) + v5_powerups (/v5_powerups/)
        run: |
          mkdir -p combined
          cp -r main_src/build/web/. combined/
          mkdir -p combined/v4
          cp -r v4_src/build/web/. combined/v4/
          mkdir -p combined/v4_powerups
          cp -r pup_src/build/web/. combined/v4_powerups/
          mkdir -p combined/v5_powerups
          cp -r v5p_src/build/web/. combined/v5_powerups/
          # GitHub Pages routes through Jekyll by default, which skips
          # paths beginning with `_`. Pygbag emits `_pythons.js`,
          # `_packages/`, etc. — the marker disables Jekyll for the
          # whole site (one at root is enough).
          touch combined/.nojekyll

      - name: List combined build artifacts
        run: |
          echo "root:";         ls -la combined
          echo "v4:";           ls -la combined/v4
          echo "v4_powerups:";  ls -la combined/v4_powerups
          echo "v5_powerups:";  ls -la combined/v5_powerups

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
